apiVersion: v1
kind: Service
metadata:
  name: facade-service
  namespace: apz-task5
spec:
  type: NodePort
  selector:
    app: facade-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
  namespace: apz-task5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      serviceAccountName: facade-service
      containers:
        - name: facade-service
          image: facade-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SERVICE_NAME
              value: facade-service
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_DISCOVERY
              value: "1"
            - name: LOGGING_URL
              value: http://logging-service:8001
            - name: COUNTER_URL
              value: http://counter-service:8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
