apiVersion: v1
kind: ServiceAccount
metadata:
  name: facade-service
  namespace: apz-task5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: facade-service-endpoints-reader
  namespace: apz-task5
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: facade-service-endpoints-reader
  namespace: apz-task5
subjects:
  - kind: ServiceAccount
    name: facade-service
    namespace: apz-task5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: facade-service-endpoints-reader

