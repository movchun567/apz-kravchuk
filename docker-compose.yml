services:
  config-server:
    build: ./config_server
    ports:
      - "8010:8010"

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  hazelcast1:
    image: hazelcast/hazelcast:5.3
    volumes:
      - ./hazelcast-docker.xml:/opt/hazelcast/config/hazelcast-docker.xml:ro
    environment:
      - HZ_CLUSTERNAME=dev

  hazelcast2:
    image: hazelcast/hazelcast:5.3
    volumes:
      - ./hazelcast-docker.xml:/opt/hazelcast/config/hazelcast-docker.xml:ro
    environment:
      - HZ_CLUSTERNAME=dev

  hazelcast3:
    image: hazelcast/hazelcast:5.3
    volumes:
      - ./hazelcast-docker.xml:/opt/hazelcast/config/hazelcast-docker.xml:ro
    environment:
      - HZ_CLUSTERNAME=dev

  logging-service-1:
    build: ./logging_service
    ports:
      - "8001:8001"
    environment:
      - LOGGING_INSTANCE_ID=1
      - SERVICE_NAME=logging-service
      - SELF_URL=http://logging-service-1:8001
      - CONFIG_SERVER_URL=http://config-server:8010
      - HZ_CLUSTER_NAME=dev
      - HZ_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  logging-service-2:
    build: ./logging_service
    ports:
      - "8003:8001"
    environment:
      - LOGGING_INSTANCE_ID=2
      - SERVICE_NAME=logging-service
      - SELF_URL=http://logging-service-2:8001
      - CONFIG_SERVER_URL=http://config-server:8010
      - HZ_CLUSTER_NAME=dev
      - HZ_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  logging-service-3:
    build: ./logging_service
    ports:
      - "8004:8001"
    environment:
      - LOGGING_INSTANCE_ID=3
      - SERVICE_NAME=logging-service
      - SELF_URL=http://logging-service-3:8001
      - CONFIG_SERVER_URL=http://config-server:8010
      - HZ_CLUSTER_NAME=dev
      - HZ_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=counter
      - POSTGRES_USER=counter
      - POSTGRES_PASSWORD=counter
    volumes:
      - pgdata:/var/lib/postgresql/data

  counter-service:
    build: ./counter_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://counter:counter@postgres:5432/counter
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=counter-transactions
      - SERVICE_NAME=counter-service
      - SELF_URL=http://counter-service:8002
      - CONFIG_SERVER_URL=http://config-server:8010
    depends_on:
      - postgres
      - kafka
      - config-server

  facade-service:
    build: ./facade_service
    ports:
      - "8000:8000"
    environment:
      - LOGGING_URLS=http://logging-service-1:8001,http://logging-service-2:8001,http://logging-service-3:8001
      - COUNTER_URL=http://counter-service:8002
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=counter-transactions
      - SERVICE_NAME=facade-service
      - SELF_URL=http://facade-service:8000
      - CONFIG_SERVER_URL=http://config-server:8010
    depends_on:
      - logging-service-1
      - logging-service-2
      - logging-service-3
      - counter-service
      - kafka
      - config-server

volumes:
  pgdata:
